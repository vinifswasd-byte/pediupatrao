# Conexão com o MongoDB Atlas.
# A string de conexão NÃO fica neste arquivo, porque ele vai para o GitHub.
# Crie o arquivo src/main/resources/segredos.properties (já está no .gitignore)
# copiando o segredos.properties.exemplo e colocando a sua string do Atlas.
# Também funciona definindo a variável de ambiente MONGODB_URI.
spring.config.import=optional:classpath:segredos.properties
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=pizzaria

# Cria os índices declarados nas entidades (ex.: sequência única da auditoria)
spring.data.mongodb.auto-index-creation=true

# Senha dos usuários criados na primeira execução (admin, gerente01, atendente01).
# Troque depois pelo cadastro de usuários.
pediupatrao.usuarios-iniciais.senha=teste123

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.umc.pediupatrao=INFO
